name: Portable release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run validate
      - name: Build portable ZIP
        shell: pwsh
        run: ./scripts/build-portable.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: antigravity-desktop-zhcn-portable-win-x64
          path: |
            .runtime/release/*.zip
            .runtime/release/*.sha256
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseNotes = (& node scripts/generate-release-notes.mjs) -join "`n"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($releaseNotes)) {
            throw "Release 兼容版本说明生成失败。"
          }
          $artifacts = Get-ChildItem -LiteralPath .runtime/release -File |
            Where-Object { $_.Extension -eq '.zip' -or $_.Name.EndsWith('.sha256') } |
            Select-Object -ExpandProperty FullName
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @artifacts --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @artifacts --generate-notes --notes $releaseNotes --title $env:GITHUB_REF_NAME
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release 发布失败。"
          }
